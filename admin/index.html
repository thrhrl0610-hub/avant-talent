<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avant Talent — Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F7F4EF; --stone: #E8E3DA; --charcoal: #1C1C1A;
      --warm-mid: #6B6560; --accent: #B8A898; --white: #FDFCFB;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: var(--white); padding: 3rem; width: 360px; border: 0.5px solid var(--stone); }
    .login-title { font-size: 1.2rem; font-weight: 500; margin-bottom: 0.5rem; }
    .login-sub { font-size: 0.8rem; color: var(--warm-mid); margin-bottom: 2rem; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warm-mid); margin-bottom: 0.4rem; }
    .field input, .field select { width: 100%; padding: 0.65rem 0.85rem; border: 0.5px solid var(--stone); background: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--charcoal); outline: none; }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 0.75rem; background: var(--charcoal); color: var(--white); border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }
    .btn:hover { background: #333; }
    .error { font-size: 0.75rem; color: #c0392b; margin-top: 0.75rem; display: none; }
    .admin-wrap { display: none; }
    .admin-nav { background: var(--charcoal); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .admin-nav-logo { color: var(--white); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .admin-nav-logout { color: var(--accent); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; }
    .admin-body { padding: 2.5rem 2rem; max-width: 900px; margin: 0 auto; }
    .admin-title { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.5rem; }
    .admin-sub { font-size: 0.82rem; color: var(--warm-mid); margin-bottom: 2rem; }
    .add-form { background: var(--white); border: 0.5px solid var(--stone); padding: 2rem; margin-bottom: 2.5rem; }
    .add-form h2 { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warm-mid); margin-bottom: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-grid .field { margin-bottom: 0; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-row .field { margin-bottom: 0; }
    .btn-add { padding: 0.75rem 2rem; background: var(--charcoal); color: var(--white); border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }
    .talent-list h2 { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warm-mid); margin-bottom: 1rem; }
    .talent-item { background: var(--white); border: 0.5px solid var(--stone); padding: 1rem 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; }
    .talent-item-info { display: flex; align-items: center; gap: 1rem; }
    .talent-item-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: white; font-weight: 500; flex-shrink: 0; }
    .talent-item-name { font-size: 0.88rem; font-weight: 500; }
    .talent-item-type { font-size: 0.72rem; color: var(--warm-mid); }
    .btn-delete { padding: 0.35rem 0.85rem; border: 0.5px solid var(--stone); background: none; cursor: pointer; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: #c0392b; font-family: 'DM Sans', sans-serif; }
    .empty-state { color: var(--warm-mid); font-size: 0.85rem; padding: 1.5rem 0; }
    .success-msg { font-size: 0.75rem; color: #27ae60; margin-top: 0.75rem; display: none; }
  </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <p class="login-title">Avant Talent</p>
    <p class="login-sub">Admin access only</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password" />
    </div>
    <button class="btn" id="loginBtn">Enter</button>
    <p class="error" id="loginError">Incorrect password</p>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <nav class="admin-nav">
    <span class="admin-nav-logo">Avant Talent — Admin</span>
    <button class="admin-nav-logout" id="logoutBtn">Log out</button>
  </nav>
  <div class="admin-body">
    <p class="admin-title">Talent Roster</p>
    <p class="admin-sub">Add or remove talent from the public roster.</p>
    <div class="add-form">
      <h2>Add New Talent</h2>
      <div class="form-grid">
        <div class="field"><label>Full Name</label><input type="text" id="newName" placeholder="e.g. Mia Kim" /></div>
        <div class="field"><label>Initials</label><input type="text" id="newInitials" placeholder="e.g. MK" maxlength="2" /></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Category</label>
          <select id="newCat">
            <option value="influencer">Influencer</option>
            <option value="model">Model</option>
          </select>
        </div>
        <div class="field"><label>Type</label><input type="text" id="newType" placeholder="e.g. Lifestyle" /></div>
        <div class="field"><label>Avatar Color</label><input type="color" id="newColor" value="#B8A898" style="height:42px;" /></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Instagram URL</label><input type="text" id="newInsta" placeholder="https://instagram.com/username" /></div>
        <div class="field"><label>TikTok URL</label><input type="text" id="newTiktok" placeholder="https://tiktok.com/@username" /></div>
      </div>
      <button class="btn-add" id="addBtn">Add to Roster</button>
      <p class="success-msg" id="successMsg">✓ Talent added</p>
    </div>
    <div class="talent-list">
      <h2>Current Roster (<span id="talentCount">0</span>)</h2>
      <div id="talentListEl"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://qsvkyyahotktvvovadak.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmt5eWFob3RrdHZ2b3ZhZGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjI2OTIsImV4cCI6MjA5MTI5ODY5Mn0.pIitdj95aV7fMUbcLZO9LaaysuCPMxwwsbrKlcJAj9M';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const PASSWORD = 'avantadmin2025';

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('addBtn').addEventListener('click', addTalent);

  function login() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === PASSWORD) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('adminWrap').style.display = 'block';
      loadTalent();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('adminWrap').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  async function addTalent() {
    const name = document.getElementById('newName').value.trim();
    const initials = document.getElementById('newInitials').value.trim();
    const cat = document.getElementById('newCat').value;
    const type = document.getElementById('newType').value.trim();
    const color = document.getElementById('newColor').value;
    const insta = document.getElementById('newInsta').value.trim();
    const tiktok = document.getElementById('newTiktok').value.trim();

    if (!name || !initials) return alert('Name and initials are required');

    const { error } = await supabase.from('talent').insert([{ name, initials, cat, type, color, insta, tiktok }]);
    if (error) return alert('Error: ' + error.message);

    ['newName','newInitials','newType','newInsta','newTiktok'].forEach(id => document.getElementById(id).value = '');
    const msg = document.getElementById('successMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
    loadTalent();
  }

  async function deleteTalent(id) {
    if (!confirm('Remove this talent?')) return;
    await supabase.from('talent').delete().eq('id', id);
    loadTalent();
  }

  async function loadTalent() {
    const { data } = await supabase.from('talent').select('*').order('created_at');
    const el = document.getElementById('talentListEl');
    document.getElementById('talentCount').textContent = data ? data.length : 0;
    if (!data || data.length === 0) {
      el.innerHTML = '<p class="empty-state">No talent added yet.</p>';
      return;
    }
    el.innerHTML = data.map(t => `
      <div class="talent-item">
        <div class="talent-item-info">
          <div class="talent-item-avatar" style="background:${t.color}">${t.initials}</div>
          <div>
            <p class="talent-item-name">${t.name}</p>
            <p class="talent-item-type">${t.cat.charAt(0).toUpperCase()+t.cat.slice(1)} · ${t.type}</p>
          </div>
        </div>
        <button class="btn-delete" data-id="${t.id}">Remove</button>
      </div>
    `).join('');

    document.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => deleteTalent(btn.dataset.id));
    });
  }
</script>
</body>
</html>
